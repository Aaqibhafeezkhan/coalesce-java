plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'A/B load harness for the coalescing starter — not published'

dependencies {
    // The starter contributes its beans through auto-configuration. Nothing in this module
    // component-scans the library, which is exactly how a downstream consumer will use it.
    implementation project(':coalesce-spring-boot-starter')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
}
