# Runs on every pull request targeting main.
#
# Deliberately not on push to main: merging there triggers the release workflow, which runs
# this same build before publishing. Duplicating it would just burn minutes and produce two
# conflicting status checks for one commit.
#
# This workflow never publishes anything -- it has no credentials and read-only permissions.

name: CI

on:
  pull_request:
    branches: [main]
    # A documentation change cannot break the build, and this build is not cheap: it starts a
    # Redis service container and runs both modules. Path filters are safe here because the
    # protect-main ruleset requires no status checks. Add one and this needs revisiting: a
    # required check that never reports blocks the pull request outright.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'postman/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# One run per branch. A new push to a PR cancels the previous run, since only the latest
# commit matters there; runs on main are left alone so the history of main stays complete.
# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # Without this the integration tests skip themselves and CI goes green having proved
    # nothing about coalescing -- which is the only thing this library does.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Confirm Redis is actually reachable
        run: |
          # The integration tests are gated on this exact probe. If it fails they would
          # quietly skip, so fail here instead and say why.
          timeout 30 bash -c 'until (echo > /dev/tcp/localhost/6379) 2>/dev/null; do sleep 1; done' \
            || { echo "::error::Redis is not reachable on localhost:6379; integration tests would silently skip"; exit 1; }
          echo "Redis reachable"

      - name: Build and test
        run: ./gradlew --no-daemon build

      # Proves the publishing configuration still works, months before anyone tries to cut
      # a release with it. Unsigned -- no key is present here -- but it generates the POM,
      # the sources jar and the javadoc jar exactly as a release would.
      - name: Check the artifact still assembles and the POM is complete
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :coalesce-spring-boot-starter:publishMavenJavaPublicationToStagingRepository

          POM=$(find coalesce-spring-boot-starter/build/staging-deploy -name '*.pom' | head -1)
          echo "Checking $POM"
          MISSING=0
          # Maven Central rejects a POM missing any of these, and finding that out during a
          # release means burning a version number on a failed deployment.
          for TAG in name description url licenses developers scm; do
            if ! grep -q "<${TAG}>" "$POM"; then echo "::error::POM is missing <${TAG}>"; MISSING=1; fi
          done
          exit $MISSING

      - name: Summarise test results
        if: always()
        run: python3 .github/scripts/test-summary.py >> "$GITHUB_STEP_SUMMARY"

      # Kept on failure especially: the console output alone rarely says which assertion
      # went and why.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  testcontainers:
    name: Test Redis integration with Testcontainers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run integration tests without a Redis service
        run: ./gradlew --no-daemon :coalesce-demo:test
